name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, which must match the version in Cargo.toml.
        required: true

env:
  VERSION: ${{ inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: aarch64-darwin
            target: aarch64-apple-darwin
            runner: [self-hosted, macOS, ARM64]
          - host: x86_64-darwin
            target: x86_64-apple-darwin
            runner: [self-hosted, macOS, ARM64]
          - host: aarch64-linux
            target: aarch64-unknown-linux-gnu
            runner: [self-hosted, Linux, ARM64]
          - host: x86_64-linux
            target: x86_64-unknown-linux-gnu
            runner: [self-hosted, Linux, X64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        run: test "$(nu -c 'open Cargo.toml | get workspace.package.version')" = "$VERSION"
      - name: Build
        run: nu scripts/release/build.nu --target ${{ matrix.target }}
      - name: Verify
        run: nu scripts/release/verify.nu release/tangram_${{ matrix.host }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tangram_${{ matrix.host }}
          path: release/tangram_${{ matrix.host }}.tar.gz
          if-no-files-found: error

  app:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Build, sign, and notarize the app
        run: nu scripts/macos/release.nu
      - uses: actions/upload-artifact@v4
        with:
          name: Tangram
          path: packages/macos/build/Distribution/Tangram.zip
          if-no-files-found: error

  image:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push the image
        run: >
          docker buildx build
          --platform linux/amd64,linux/arm64
          --build-arg "TANGRAM_CLI_COMMIT_HASH=$GITHUB_SHA"
          --tag "ghcr.io/tangramdotdev/tangram:$VERSION"
          --push .

  release:
    needs: [build, app, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Write the checksums
        working-directory: release
        run: sha256sum tangram_*.tar.gz Tangram.zip > SHASUMS256.txt && cat SHASUMS256.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$VERSION" release/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "$VERSION"
          --draft
          --generate-notes
          --notes "The Linux binaries require glibc 2.34 or later."

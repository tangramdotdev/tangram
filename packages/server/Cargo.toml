[package]
name = "tangram_server"

description = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = false
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["tangram_js", "tokio-postgres"]

[features]
foundationdb = [
	"dep:tangram_index_fdb",
	"tangram_sandbox/foundationdb",
]
js = ["dep:tangram_js"]
lmdb = ["dep:heed", "dep:tangram_cache_lmdb", "dep:tangram_index_lmdb"]
nats = ["dep:async-nats", "dep:tangram_messenger_nats"]
postgres = ["dep:tokio-postgres", "dep:tangram_database_postgres"]
quickjs = ["tangram_js/quickjs"]
scylla = ["dep:tangram_cache_scylla"]
sqlite = ["dep:rusqlite", "dep:tangram_database_sqlite"]
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:tokio-rustls", "tangram_database_postgres?/tls"]
turso = ["dep:turso", "dep:tangram_database_turso"]
typescript = ["tangram_compiler/typescript"]
v8 = ["tangram_js/v8"]
vsock = ["dep:tokio-vsock", "tangram_client/vsock", "tangram_sandbox/vsock"]

[lib]
doctest = false
test = false

[lints]
workspace = true

[dependencies]
async-broadcast = { workspace = true }
async-channel = { workspace = true }
async-nats = { workspace = true, optional = true }
aws-lc-rs = { workspace = true }

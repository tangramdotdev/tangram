[package]
name = "tangram_server_core"

description = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = false
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["tokio-postgres"]

[features]
fjall = ["tangram_server_cache/fjall"]
foundationdb = [
	"dep:tangram_index_fdb",
	"tangram_sandbox/foundationdb",
	"tangram_server_index/foundationdb",
]
javascript = ["tangram_compiler/javascript"]
lmdb = ["dep:tangram_index_lmdb", "tangram_server_cache/lmdb", "tangram_server_index/lmdb"]
nats = ["dep:async-nats", "tangram_server_messenger/nats"]
postgres = ["dep:tokio-postgres", "dep:tangram_database_postgres", "tangram_server_database/postgres"]
python = ["tangram_compiler/python"]
rocksdb = ["tangram_server_cache/rocksdb"]
scylla = ["tangram_server_cache/scylla"]
sqlite = ["dep:tangram_database_sqlite", "tangram_server_database/sqlite"]
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:tokio-rustls", "tangram_database_postgres?/tls", "tangram_server_database/tls"]
tsrs = ["javascript", "tangram_compiler/tsrs"]
turso = ["dep:tangram_database_turso", "tangram_server_database/turso"]
ty = ["python", "tangram_compiler/ty"]
vsock = ["dep:tokio-vsock", "tangram_client/vsock", "tangram_sandbox/vsock"]

[lib]
doctest = false
test = true

[lints]
workspace = true


[package]
name = "tangram_cli"

description = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = false
repository = { workspace = true }
rust-version = { workspace = true }
autotests = false
version = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["tangram_fdb"]

[[bin]]
name = "tangram"
path = "src/main.rs"

[[test]]
name = "tests"
path = "tests/main.rs"

[features]
default = ["cpython", "lmdb", "sqlite", "tls", "tsrs", "ty", "v8"]
cpython = ["python", "tangram_cli_builtin/cpython", "tangram_cli_core/cpython"]
fjall = ["tangram_cli_server/fjall"]
foundationdb = ["dep:foundationdb", "dep:tangram_fdb", "tangram_cli_server/foundationdb"]
javascript = ["tangram_cli_server/javascript"]
lmdb = ["tangram_cli_server/lmdb"]
nats = ["tangram_cli_server/nats"]
postgres = ["tangram_cli_server/postgres"]
python = ["tangram_cli_server/python"]
quickjs = ["dep:tangram_cli_repl", "javascript", "tangram_cli_builtin/quickjs", "tangram_cli_core/quickjs", "tangram_cli_repl/quickjs"]
rocksdb = ["tangram_cli_server/rocksdb"]
scylla = ["tangram_cli_server/scylla"]
sqlite = ["tangram_cli_server/sqlite"]
tls = ["tangram_cli_core/tls", "tangram_cli_server/tls"]
tsrs = ["javascript", "tangram_cli_server/tsrs"]
turso = ["tangram_cli_server/turso"]
ty = ["python", "tangram_cli_server/ty"]
v8 = ["dep:tangram_cli_repl", "javascript", "tangram_cli_builtin/v8", "tangram_cli_core/v8", "tangram_cli_repl/v8"]
vsock = ["tangram_cli_core/vsock", "tangram_cli_server/vsock"]

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
foundationdb = { workspace = true, optional = true }
futures = { workspace = true }
rustls = { workspace = true }
tangram_cli_archive = { workspace = true }
tangram_cli_authorization = { workspace = true }
tangram_cli_availability = { workspace = true }
tangram_cli_builtin = { workspace = true }
tangram_cli_bundle = { workspace = true }
tangram_cli_check = { workspace = true }
tangram_cli_checkin = { workspace = true }
tangram_cli_checkout = { workspace = true }
tangram_cli_checkpoint = { workspace = true }
tangram_cli_checksum = { workspace = true }
tangram_cli_children = { workspace = true }
tangram_cli_clean = { workspace = true }
tangram_cli_clock = { workspace = true }
tangram_cli_compress = { workspace = true }
tangram_cli_core = { workspace = true }
tangram_cli_decompress = { workspace = true }
tangram_cli_document = { workspace = true }
tangram_cli_download = { workspace = true }
tangram_cli_extract = { workspace = true }
tangram_cli_format = { workspace = true }
tangram_cli_get = { workspace = true }
tangram_cli_grants = { workspace = true }
tangram_cli_group = { workspace = true }
tangram_cli_health = { workspace = true }
tangram_cli_id = { workspace = true }
tangram_cli_index = { workspace = true }
tangram_cli_init = { workspace = true }
tangram_cli_interface = { workspace = true }
tangram_cli_list = { workspace = true }
tangram_cli_lsp = { workspace = true }
tangram_cli_match = { workspace = true }
tangram_cli_metadata = { workspace = true }
tangram_cli_new = { workspace = true }
tangram_cli_object = { workspace = true }
tangram_cli_organization = { workspace = true }
tangram_cli_outdated = { workspace = true }
tangram_cli_process = { workspace = true }
tangram_cli_publish = { workspace = true }
tangram_cli_pull = { workspace = true }
tangram_cli_push = { workspace = true }
tangram_cli_put = { workspace = true }
tangram_cli_read = { workspace = true }
tangram_cli_remote = { workspace = true }
tangram_cli_repl = { workspace = true, optional = true }
tangram_cli_runner = { workspace = true }
tangram_cli_sandbox = { workspace = true }
tangram_cli_server = { workspace = true }
tangram_cli_shell = { workspace = true }
tangram_cli_tag = { workspace = true }
tangram_cli_tangram = { workspace = true }
tangram_cli_touch = { workspace = true }
tangram_cli_tree = { workspace = true }
tangram_cli_update = { workspace = true }
tangram_cli_usage = { workspace = true }
tangram_cli_user = { workspace = true }
tangram_cli_view = { workspace = true }
tangram_cli_wait = { workspace = true }
tangram_cli_watch = { workspace = true }
tangram_cli_write = { workspace = true }
tangram_client = { workspace = true }
tangram_fdb = { workspace = true, optional = true }
tokio = { workspace = true }

[dev-dependencies]
tangram_tests_util = { workspace = true, features = ["cli"] }

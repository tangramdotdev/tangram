[package]
name = "tangram_cli"

description = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = false
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["tangram_fdb"]

[[bin]]
name = "tangram"
path = "src/main.rs"

[features]
default = ["javascript", "lmdb", "python", "sqlite", "tls", "typescript", "v8"]
fjall = ["tangram_server/fjall"]
foundationdb = ["dep:foundationdb", "dep:tangram_fdb", "tangram_server/foundationdb"]
javascript = ["tangram_server/javascript"]
lmdb = ["tangram_server/lmdb"]
nats = ["tangram_server/nats"]
postgres = ["tangram_server/postgres"]
python = ["dep:tangram_python", "tangram_server/python"]
quickjs = ["javascript", "tangram_server/quickjs", "tangram_javascript/quickjs"]
rocksdb = ["tangram_server/rocksdb"]
scylla = ["tangram_server/scylla"]
sqlite = ["tangram_server/sqlite"]
tls = ["tangram_client/tls", "tangram_server/tls"]
turso = ["tangram_server/turso"]
typescript = ["tangram_server/typescript", "v8"]
v8 = ["dep:v8", "javascript", "tangram_server/v8", "tangram_javascript/v8"]
vsock = ["tangram_client/vsock", "tangram_sandbox/vsock", "tangram_server/vsock"]

[lints]
workspace = true

[dependencies]
anstream = { workspace = true }
astral-tokio-tar = { workspace = true }
async-compression = { workspace = true }
async_zip = { workspace = true }
byte-unit = { workspace = true }
byteorder = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_complete_nushell = { workspace = true }
console-subscriber = { workspace = true }
crossterm = { workspace = true }
data-encoding = { workspace = true }
deno_core_icudata = { workspace = true }
derive_more = { workspace = true }
foundationdb = { workspace = true, optional = true }
futures = { workspace = true }
humantime = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
indexmap = { workspace = true }
indoc = { workspace = true }
libc = { workspace = true }
liblzma = { workspace = true }
maml = { workspace = true }
miette = { workspace = true }
num = { workspace = true }
nu-ansi-term = { workspace = true }
owo-colors = { workspace = true }
petgraph = { workspace = true }
radix_trie = { workspace = true }
rand = { workspace = true }
ratatui = { workspace = true }
reedline = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde_with = { workspace = true }
syntect = { workspace = true }
tangram_billing_stripe = { workspace = true }
tangram_client = { workspace = true }
tangram_compiler = { workspace = true }
tangram_fdb = { workspace = true, optional = true }
tangram_futures = { workspace = true }
tangram_http = { workspace = true }
tangram_javascript = { workspace = true }
tangram_python = { workspace = true, optional = true }
tangram_pool = { workspace = true }
tangram_sandbox = { workspace = true }
tangram_server = { workspace = true }
tangram_uri = { workspace = true }
tangram_util = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-tree = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
v8 = { workspace = true, optional = true }
waitpid-any = { workspace = true }
webbrowser = { workspace = true }

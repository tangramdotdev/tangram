[package]
name = "tangram_tests_util"

description = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = false
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[features]
cli = ["instance"]
database = ["dep:futures", "dep:regex", "dep:tokio"]
instance = ["database", "dep:serde", "dep:tangram_client", "dep:tangram_uri"]
server = ["dep:tangram_cli_core", "dep:tangram_cli_server", "dep:tangram_server", "instance"]

[dependencies]
futures = { workspace = true, optional = true }
libc = { workspace = true }
rand = { workspace = true }
regex = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
tangram_cli_core = { workspace = true, optional = true }
tangram_cli_server = { workspace = true, optional = true }
tangram_client = { workspace = true, optional = true }
tangram_server = { workspace = true, features = ["lmdb", "sqlite"], optional = true }
tangram_uri = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

authors = ["tangramdotdev"]
description = "Tangram extension for Zed."
id = "tangram"
name = "Tangram"
repository = "https://github.com/tangramdotdev/tangram"
schema_version = 1
version = "0.0.0"

[grammars.javascript]
repository = "https://github.com/tree-sitter/tree-sitter-javascript"
rev = "58404d8cf191d69f2674a8fd507bd5776f46cb11"

[grammars.json]
repository = "https://github.com/tree-sitter/tree-sitter-json"
rev = "ee35a6ebefcef0c5c416c0d1ccec7370cfca5a24"

[grammars.python]
repository = "https://github.com/tree-sitter/tree-sitter-python"
rev = "d326e4cad262cf681656e130960e49dfc04c03ea"

[grammars.toml]
repository = "https://github.com/tree-sitter/tree-sitter-toml"
rev = "342d9be207c2dba869b9967124c679b5e6fd0ebe"

[grammars.typescript]
repository = "https://github.com/tree-sitter/tree-sitter-typescript"
rev = "75b3874edb2dc714fb1fd77a32013d0f8699989f"
path = "typescript"

[grammars.yaml]
repository = "https://github.com/zed-industries/tree-sitter-yaml"
rev = "baff0b51c64ef6a1fb1f8390f3ad6015b83ec13a"

[language_servers.tangram]
name = "Tangram"
languages = [
    "Tangram Interface JSON",
    "Tangram Interface Python",
    "Tangram Interface TypeScript",
    "Tangram JavaScript",
    "Tangram JSON",
    "Tangram Python",
    "Tangram TOML",
    "Tangram TypeScript",
    "Tangram YAML",
]

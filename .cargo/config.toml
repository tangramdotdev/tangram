[env]
MACOSX_DEPLOYMENT_TARGET = "26.0"
PYO3_CONFIG_FILE = { value = "packages/python/packages/build/pyo3.txt", relative = true }
RUSTY_V8_MIRROR = "https://github.com/denoland/rusty_v8/releases/download"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
debug-assertions = false
opt-level = 3
overflow-checks = false

[profile.debugger]
inherits = "dev"
debug = true

[profile.fast]
inherits = "release"
lto = "off"

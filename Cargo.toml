tokio-util = { version = "0.7", features = ["full"] }
tokio-vsock = "0.7.2"
toml = { version = "1" }
tower = { version = "0.5", features = ["timeout", "util"] }
tower-http = { version = "0.7", features = ["add-extension", "compression-zstd", "decompression-zstd", "map-request-body", "map-response-body", "set-header", "timeout", "util"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-tree = "0.4"
tsrs_ast = { git = "https://github.com/tangramdotdev/tsrs" }
tsrs_checker = { git = "https://github.com/tangramdotdev/tsrs" }
tsrs_compiler = { git = "https://github.com/tangramdotdev/tsrs" }
tsrs_core = { git = "https://github.com/tangramdotdev/tsrs" }
tsrs_diagnostics = { git = "https://github.com/tangramdotdev/tsrs" }
tsrs_ls = { git = "https://github.com/tangramdotdev/tsrs" }
tsrs_lsproto = { git = "https://github.com/tangramdotdev/tsrs" }
tsrs_module = { git = "https://github.com/tangramdotdev/tsrs" }
tsrs_project = { git = "https://github.com/tangramdotdev/tsrs" }
tsrs_scanner = { git = "https://github.com/tangramdotdev/tsrs" }
tsrs_vfs = { git = "https://github.com/tangramdotdev/tsrs" }
turso = "0.8"
unicode-segmentation = "1"
unicode-width = "0.2"
ty_ide = { git = "https://github.com/tangramdotdev/ruff" }
ty_module_resolver = { git = "https://github.com/tangramdotdev/ruff" }
ty_project = { git = "https://github.com/tangramdotdev/ruff" }
ty_python_core = { git = "https://github.com/tangramdotdev/ruff" }
ty_python_semantic = { git = "https://github.com/tangramdotdev/ruff" }
ty_text_size = { package = "ruff_text_size", git = "https://github.com/tangramdotdev/ruff" }
ty_vendored = { git = "https://github.com/tangramdotdev/ruff" }
uuid = { version = "1", features = ["v7"] }
v8 = "152"
virtiofsd = { git = "https://github.com/tangramdotdev/virtiofsd" }
vhost = "0.16"
vhost-user-backend = "0.22"
vm-memory = { version = "0.17", features = ["backend-atomic", "backend-mmap"] }
vt100 = "0.16"
waitpid-any = "0.3"
weak-table = "0.4"
webbrowser = "1"
winnow = "1"
xattr = { version = "1" }
zed_extension_api = "0.7"
zerocopy = { version = "0.8", features = ["derive"] }
zstd = "0.14"

[workspace.metadata.cargo-shear]
ignored = [
	"liblzma",
]
